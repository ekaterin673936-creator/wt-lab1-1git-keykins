<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — Как я провёл лето</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .contact-hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 60px 0;
        }
        .contact-card {
            border: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }
        .contact-card:hover {
            transform: translateY(-5px);
        }
        .contact-icon {
            font-size: 2.5rem;
            color: #764ba2;
        }
    </style>
</head>
<body>

    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">☀️ Моё лето</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Главная</a>
                <a class="nav-link active" href="contacts.html">Контакты</a>
            </div>
        </div>
    </nav>

    <!-- Заголовок -->
    <header class="contact-hero text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Связаться со мной</h1>
            <p class="lead">Буду рада обратной связи!</p>
        </div>
    </header>

    <!-- Контакты -->
    <section class="py-5">
        <div class="container">
            <div class="row g-4">

                <div class="col-md-4">
                    <div class="card contact-card h-100 text-center p-4">
                        <div class="contact-icon">📧</div>
                        <h5 class="mt-3">Email</h5>
                        <p class="text-muted">example@mail.ru</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card contact-card h-100 text-center p-4">
                        <div class="contact-icon">📱</div>
                        <h5 class="mt-3">Телефон</h5>
                        <p class="text-muted">+7 (999) 000-00-00</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card contact-card h-100 text-center p-4">
                        <div class="contact-icon">🌐</div>
                        <h5 class="mt-3">GitHub</h5>
                        <p class="text-muted">github.com/VictoriaKobzeva</p>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Форма обратной связи -->
    <section class="py-5 bg-light">
        <div class="container" style="max-width: 600px;">
            <h2 class="text-center mb-4">Напишите мне</h2>
            <form>
                <div class="mb-3">
                    <label for="name" class="form-label">Имя</label>
                    <input type="text" class="form-control" id="name" placeholder="Ваше имя">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="your@email.com">
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Сообщение</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Ваше сообщение..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">Отправить</button>
            </form>
        </div>
    </section>

    <!-- Подвал -->
    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p class="mb-0">© 2026 Кобзева Виктория · Страница «Контакты»</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
